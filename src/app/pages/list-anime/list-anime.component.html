<div class="liste-container">

  <div class="filter-chips">
    <div class="chip" *ngFor="let cat of categories"
         (click)="filterByCategory(cat)" [class.active]="selectedCategory === cat">
      {{ cat }}
    </div>
  </div>

  <div class="filter-chips themes-bar">
    <div class="chip theme" *ngFor="let t of themesList"
         (click)="filterByTheme(t)" [class.active]="selectedTheme === t">
      {{ t }}
    </div>
  </div>

  <hr class="separator">

  <div class="sort-bar">
    <span class="sort-label">Trier :</span>
    <button class="sort-btn" [class.active]="sortType === 'alpha'" (click)='setSortType("alpha")'>
      Name <mat-icon *ngIf="sortType === 'alpha'">{{ sortOrder === 'asc' ? 'arrow_upward' : 'arrow_downward' }}</mat-icon>
    </button>
    <button class="sort-btn" [class.active]="sortType === 'score'" (click)='setSortType("score")'>
      Note <mat-icon *ngIf="sortType === 'score'">{{ sortOrder === 'asc' ? 'arrow_upward' : 'arrow_downward' }}</mat-icon>
    </button>
    <button class="sort-btn" [class.active]="sortType === 'episodes'" (click)='setSortType("episodes")'>
      Eps <mat-icon *ngIf="sortType === 'episodes'">{{ sortOrder === 'asc' ? 'arrow_upward' : 'arrow_downward' }}</mat-icon>
    </button>
  </div>

  <div class="anime-grid" *ngIf="filteredAnimes.length > 0">
    <div class="anime-card" *ngFor="let anime of filteredAnimes">
      <img [src]="anime.image" [alt]="anime.title">
      <div class="anime-overlay">
        <span class="anime-title">{{ anime.title }}</span>
        <div class="anime-info">
          <span>⭐ {{ anime.score }}</span>
          <span>{{ anime.episodes }} eps</span>
        </div>
        <div class="theme-tags">
          <span class="tag" *ngFor="let theme of anime.themes">{{ theme }}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="no-results" *ngIf="filteredAnimes.length === 0">
    <mat-icon>search_off</mat-icon>
    <p>No anime found</p>
  </div>

</div>
