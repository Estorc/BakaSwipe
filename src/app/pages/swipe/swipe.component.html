<div class="container">
  <div *ngIf="cards[currentIndex]" class="stack">
    <!-- seule la carte du dessus est interactive -->
    <div
      #hero
      class="hero"
      [style.--bg]="'url(' + cards[currentIndex].image + ')'"
      [class.dragging]="dragging"
      [class.animating]="animating"
      (pointerdown)="startDrag($event)"
      (pointermove)="onDrag($event)"
      (pointerup)="endDrag($event)"
      (pointercancel)="endDrag($event)"
      (click)="onClick()"
      [style.transform]="'translate(' + x + 'px, ' + y + 'px) rotate(' + rotation + 'deg)'"
    >
      <div class="title">{{ cards[currentIndex].title }}</div>

      <div class="meta">
        <div class="tag" *ngFor="let tag of cards[currentIndex].tags">{{ tag }}</div>
        <div>{{ cards[currentIndex].episodes }}</div>
        <div class="rating">{{ cards[currentIndex].rating }}</div>
      </div>

      <div class="desc">{{ cards[currentIndex].desc }}</div>

    </div>
  </div>
<div class="description-sheet" [class.is-open]="showDescription">
  <div class="drag-handle" (click)="showDescription = false"></div>

  <div class="sheet-scroll-content">
    <div class="section">
      <h1 class="sheet-main-title">{{ cards[currentIndex].title }}</h1>
      <h3>Description</h3>
      <p class="text-muted">{{ cards[currentIndex].desc }}</p>
    </div>

    <div class="section-full-width">
      <div class="section"><h3>Themes</h3></div>
      <div class="theme-chips">
      <div class="chip-ios" *ngFor="let tag of cards[currentIndex].tags">{{ tag }}</div>
      </div>
    </div>

    <div class="section-full-width">
      <div class="section"><h3>Status</h3></div>
      <div class="status-container">
        <button 
          *ngFor="let status of statusList"
          class="btn-status"
          [class.active]="selectedStatus === status"
          (click)="selectStatus(status)">
          {{ status }}
        </button>
      </div>
    </div>

    <div class="section">
      <h3>Bandes annonces</h3>
      <div class="trailer-preview">
        <img [src]="cards[currentIndex].image" alt="trailer">
        <div class="play-overlay"><mat-icon>play_arrow</mat-icon></div>
      </div>
    </div>

    <app-note-slider></app-note-slider>

  </div>
</div>
  <div class="icon_container">
    <img src='assets/img/cross.png' class="cross" (click)="cross()"/> 
    <img src='assets/img/heart.png' class="heart" (click)="heart()"/> 
  </div>

<div *ngIf="showRating" class="rating-overlay">

  <div class="overlay-bg"></div>

  <div class="slider-middle">
  <app-note-slider
    (ratingSelected)="handleRating($event)">
  </app-note-slider>
  </div>
</div>
